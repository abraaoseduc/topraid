                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (Math.random() < 0.015) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                }

            } else if (currentType === "SPACE") {
                ctx.fillStyle = '#05050a';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                stars.forEach(st => {
                    st.y += st.speed;
                    if (st.y > CANVAS_HEIGHT) st.y = 0;
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + Math.sin(Date.now() * 0.005 + st.x) * 0.4})`;
                    ctx.fillRect(st.x, st.y, st.size, st.size);
                });

                asteroids.forEach(ast => {
                    ctx.save();
                    ctx.translate(ast.x, ast.y);
                    ctx.rotate(ast.angle);
                    ctx.fillStyle = '#616161';
                    ctx.strokeStyle = '#9e9e9e';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, ast.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                });

                asteroidDebris.forEach(deb => {
                    ctx.save();
                    ctx.translate(deb.x, deb.y);
                    ctx.rotate(deb.angle);
                    ctx.fillStyle = '#424242';
                    ctx.fillRect(-deb.size / 2, -deb.size / 2, deb.size, deb.size);
                    ctx.restore();
                });
            }
        }

        function drawOverlayClouds() {
            if (STAGE_CONFIG[stage - 1].type !== "STORM") return;

            clouds.forEach(c => {
                ctx.fillStyle = 'rgba(180, 190, 205, 0.45)';
                ctx.beginPath();
                ctx.ellipse(c.x + c.width / 2, c.y + c.height / 2, c.width / 2, c.height / 2, 0, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function draw() {
            if (gameState === STATE_PEACE) {
                drawPeaceScreen();
                return;
            }

            drawEnvironment();

            // MENU
            if (gameState === STATE_MENU) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('RIVER RAID RETRO', CANVAS_WIDTH / 2, 70);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Courier New';
                ctx.fillText('ESCOLHA SUA AERONAVE:', CANVAS_WIDTH / 2, 120);

                const ships = [
                    { name: 'CAÇA MILITAR', desc: 'Tiro Triplo W | 3 Raios Laser W' },
                    { name: 'HELICÓPTERO', desc: 'Tiro Duplo | Raio Central Largo' },
                    { name: 'DISCO VOADOR', desc: 'Plasma Duplo | 2 Raios em Onda' },
                    { name: 'NAVE ESPACIAL', desc: 'Feixe Reto (3x Dano) | 5 Raios Laser' }
                ];

                ships.forEach((s, idx) => {
                    let posX = 65 + idx * 150;
                    let posY = 220;

                    if (selectedShip === idx) {
                        ctx.strokeStyle = '#00ff00';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(posX - 25, posY - 30, 95, 110);
                    }

                    drawShipSprite(idx, posX, posY);

                    ctx.fillStyle = selectedShip === idx ? '#00ff00' : '#888888';
                    ctx.font = 'bold 11px Courier New';
                    ctx.fillText(s.name, posX + 14, posY + 50);
                });

                ctx.fillStyle = '#ffaa00';
                ctx.font = '13px Courier New';
                ctx.fillText(ships[selectedShip].desc, CANVAS_WIDTH / 2, 390);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Courier New';
                ctx.fillText(isMobile ? 'Toque na tela para Iniciar' : 'Pressione CTRL ou ESPAÇO para Iniciar', CANVAS_WIDTH / 2, 480);
                ctx.textAlign = 'left';
                return;
            }

            // TELA DE ESCOLHA
            if (gameState === STATE_CHOICE) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = '#00ff00';
                ctx.font = 'bold 26px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('ACORDO DE PAZ', CANVAS_WIDTH / 2, 120);

                ctx.fillStyle = '#ffffff';
                ctx.font = '15px Courier New';
                ctx.fillText('Deseja selar a PAZ ou Continuar a GUERRA?', CANVAS_WIDTH / 2, 180);

                ctx.fillStyle = '#ff3300';
                ctx.font = 'bold 18px Courier New';
                ctx.fillText(isMobile ? '[ESQUERDA] CONTINUAR A GUERRA' : '[1] CONTINUAR A GUERRA', CANVAS_WIDTH / 2, 270);
                ctx.fillStyle = '#aaaaaa';
                ctx.font = '12px Courier New';
                ctx.fillText('(Inimigos ganham +1 tiro e +LIFE)', CANVAS_WIDTH / 2, 295);

                ctx.fillStyle = '#00ffff';
                ctx.font = 'bold 18px Courier New';
                ctx.fillText(isMobile ? '[DIREITA] PROMOVER A PAZ' : '[2] PROMOVER A PAZ', CANVAS_WIDTH / 2, 370);
                ctx.fillStyle = '#aaaaaa';
                ctx.font = '12px Courier New';
                ctx.fillText('(Encara a comemoração da vitória e encerra)', CANVAS_WIDTH / 2, 395);

                ctx.textAlign = 'left';
                return;
            }

            // Esferas [A]
            friendOrbs.forEach(orb => {
                ctx.beginPath();
                ctx.arc(orb.x + 12, orb.y + 12, orb.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#0055ff';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#00ffff';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('A', orb.x + 12, orb.y + 16);
                ctx.textAlign = 'left';
            });

            // Esferas [S]
            specialOrbs.forEach(orb => {
                ctx.beginPath();
                ctx.arc(orb.x + 12, orb.y + 12, orb.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#00ffff';
                ctx.stroke();

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 14px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('S', orb.x + 12, orb.y + 16);
                ctx.textAlign = 'left';
            });

            // Esferas [F]
            fireOrbs.forEach(orb => {
                ctx.beginPath();
                ctx.arc(orb.x + 12, orb.y + 12, orb.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff6600';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffff00';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('F', orb.x + 12, orb.y + 16);
                ctx.textAlign = 'left';
            });

            // Inimigos Normais
            enemies.forEach(e => {
                let mainColor = e.hitFlash > 0 ? '#ffffff' : (e.isFrozen ? '#00ffff' : (e.type === 'ship' ? '#888888' : (e.type === 'miniufo' ? '#00ffff' : '#00e676')));

                if (e.type === 'ship') {
                    ctx.fillStyle = mainColor;
                    ctx.fillRect(e.x, e.y + 6, e.width, e.height - 6);
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(e.x + 4, e.y + 8, e.width - 8, 6);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(e.x + e.width / 2 - 4, e.y, 8, 6);
                } else if (e.type === 'miniufo') {
                    ctx.beginPath();
                    ctx.ellipse(e.x + e.width / 2, e.y + e.height / 2, 12, 7, 0, 0, Math.PI * 2);
                    ctx.fillStyle = mainColor;
                    ctx.fill();

                    let isAuraActive = Math.sin(e.auraTimer * 2) > 0;
                    if (isAuraActive) {
                        ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + Math.sin(e.auraTimer * 6) * 0.4})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(e.x + e.width / 2, e.y + e.height / 2, 22 + Math.sin(e.auraTimer * 8) * 3, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                } else if (e.type === 'monster') {
                    ctx.fillStyle = mainColor;
                    ctx.beginPath();
                    ctx.arc(e.x + 15, e.y + 14, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(e.x + 8, e.y + 8, 4, 4);
                    ctx.fillRect(e.x + 18, e.y + 8, 4, 4);
                    ctx.fillStyle = '#00ab47';
                    ctx.fillRect(e.x + 2, e.y + 20, 6, 8);
                    ctx.fillRect(e.x + 22, e.y + 20, 6, 8);
                }

                if (e.hp < e.maxHp) {
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(e.x, e.y - 6, e.width, 4);
                    ctx.fillStyle = '#00ff00';
                    let hpPct = e.hp / e.maxHp;
                    ctx.fillRect(e.x, e.y - 6, e.width * hpPct, 4);
                }
            });

            // BOSS
            if (activeBoss) {
                drawBossLayout(activeBoss);
                
                ctx.fillStyle = '#000000';
                ctx.fillRect(CANVAS_WIDTH / 2 - 100, 15, 200, 16);
                ctx.fillStyle = '#ff0000';
                let hpPct = activeBoss.hp / activeBoss.maxHp;
                ctx.fillRect(CANVAS_WIDTH / 2 - 98, 17, 196 * Math.max(0, hpPct), 12);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(`CHEFÃO FASE ${stage} (${activeBoss.cannonsCount} CANHÕES)`, CANVAS_WIDTH / 2, 28);
                ctx.textAlign = 'left';
            }

            // Tiros dos Inimigos
            ctx.fillStyle = '#ff3300';
            enemyBullets.forEach(eb => {
                ctx.fillRect(eb.x, eb.y, eb.width, eb.height);
            });

            // Tiros do Jogador
            bullets.forEach(b => {
                if (b.isHoming) {
                    ctx.fillStyle = b.fireType === 'MISSILE' ? '#ff3300' : (b.fireType === 'ICE' ? '#00ffff' : '#ffaa00');
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                } else {
                    ctx.fillStyle = (selectedShip === SHIP_SPACESHIP || selectedShip === SHIP_UFO) ? '#00ffff' : '#ffffff';
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                }
            });

            // SUPER LASER DOS AMIGOS
            if (friendSpecialTimer > 0) {
                let friendLeftX = player.x - 22;
                let friendRightX = player.x + player.width + 5;
                let friendY = player.y + 8;

                ctx.fillStyle = 'rgba(0, 255, 255, 0.4)';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;

                ctx.fillRect(friendLeftX + 3, 0, 12, friendY);
                ctx.strokeRect(friendLeftX + 5, 0, 8, friendY);

                ctx.fillRect(friendRightX + 3, 0, 12, friendY);
                ctx.strokeRect(friendRightX + 5, 0, 8, friendY);
            }

            // Especiais Ativos dos Jogadores
            if (isSpecialActive) {
                ctx.strokeStyle = `rgba(0, 255, 255, ${0.6 + Math.sin(Date.now() * 0.02) * 0.3})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 28, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(0, 255, 255, 0.15)';
                ctx.fill();

                if (selectedShip === SHIP_JET) {
                    ctx.strokeStyle = '#00ffff';
                    ctx.fillStyle = 'rgba(0, 255, 255, 0.4)';
                    ctx.lineWidth = 14;

                    ctx.fillRect(player.x + 4, 0, player.width - 8, player.y);

                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y);
                    ctx.lineTo(player.x - 250, 0);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(player.x + player.width, player.y);
                    ctx.lineTo(player.x + player.width + 250, 0);
                    ctx.stroke();

                } else if (selectedShip === SHIP_HELI) {
                    const laserWidth = player.width + 20;
                    const laserX = player.x - 10;

                    ctx.fillStyle = 'rgba(255, 200, 0, 0.4)';
                    ctx.fillRect(laserX - 6, 0, laserWidth + 12, player.y);

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(laserX, 0, laserWidth, player.y);

                    ctx.fillStyle = '#ffaa00';
                    ctx.fillRect(laserX + 4, 0, laserWidth - 8, player.y);

                } else if (selectedShip === SHIP_UFO) {
                    ctx.strokeStyle = '#ff00ff';
                    ctx.lineWidth = 6;
                    let t = Date.now() * 0.01;

                    ctx.beginPath();
                    for (let y = player.y; y >= 0; y -= 5) {
                        let x1 = (player.x + 5) + Math.sin(y * 0.05 + t) * 30;
                        if (y === player.y) ctx.moveTo(x1, y);
                        else ctx.lineTo(x1, y);
                    }
                    ctx.stroke();

                    ctx.strokeStyle = '#00ffff';
                    ctx.beginPath();
                    for (let y = player.y; y >= 0; y -= 5) {
                        let x2 = (player.x + player.width - 5) + Math.cos(y * 0.05 + t) * 30;
                        if (y === player.y) ctx.moveTo(x2, y);
                        else ctx.lineTo(x2, y);
                    }
                    ctx.stroke();
                } else if (selectedShip === SHIP_SPACESHIP) {
                    ctx.fillStyle = '#00ffff';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;

                    const offsets = [-24, -12, 0, 12, 24];
                    const centerX = player.x + player.width / 2;

                    offsets.forEach(off => {
                        let lx = centerX + off - 3;
                        ctx.fillRect(lx, 0, 6, player.y);
                        ctx.beginPath();
                        ctx.moveTo(lx + 3, 0);
                        ctx.lineTo(lx + 3, player.y);
                        ctx.stroke();
                    });
                }
            }

            // Jogador + AMIGOS
            if (gameState !== STATE_GAMEOVER) {
                if (shieldTimer === 0 || Math.floor(shieldTimer / 6) % 2 === 0) {
                    drawShipSprite(selectedShip, player.x, player.y);

                    if (friendCount >= 10) {
                        drawShipSprite(selectedShip, player.x - 22, player.y + 8, true);
                    }

                    if (friendCount >= 20) {
                        drawShipSprite(selectedShip, player.x + player.width + 5, player.y + 8, true);
                    }
                }

                if (shieldTimer > 0) {
                    ctx.strokeStyle = `rgba(0, 255, 255, ${0.4 + Math.sin(Date.now() * 0.03) * 0.4})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 24, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            drawOverlayClouds();

            // Partículas
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            // BANNER DE ANÚNCIO DE FASE
            if (stageBannerTimer > 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, CANVAS_HEIGHT / 2 - 40, CANVAS_WIDTH, 80);

                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 3;
                ctx.strokeRect(0, CANVAS_HEIGHT / 2 - 40, CANVAS_WIDTH, 80);

                const currentConfig = STAGE_CONFIG[stage - 1];
                ctx.fillStyle = '#00ffff';
                ctx.font = 'bold 24px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(`FASE ${currentConfig.id} - ${currentConfig.name}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 8);
                ctx.textAlign = 'left';
            }

            // Painel HUD Inferior
            ctx.fillStyle = '#000';
            ctx.fillRect(0, CANVAS_HEIGHT - 40, CANVAS_WIDTH, 40);

            ctx.fillStyle = '#fff';
            ctx.font = '12px Courier New';
            ctx.fillText(`SCORE:${score}`, 10, CANVAS_HEIGHT - 22);
            ctx.fillText(`FASE:${stage} (L${loopMultiplier})`, 10, CANVAS_HEIGHT - 8);

            ctx.fillText(`VIDAS:${lives}`, 145, CANVAS_HEIGHT - 22);
            ctx.fillText(`ESP:${specialsCount}`, 145, CANVAS_HEIGHT - 8);

            if (fireTimer > 0 && activeFireType) {
                ctx.fillStyle = '#ff6600';
                ctx.font = 'bold 11px Courier New';
                let typeLabel = activeFireType === 'MISSILE' ? 'MÍSSIL' : (activeFireType === 'ICE' ? 'GELO' : 'FOGO');
                ctx.fillText(`FIRE [${typeLabel}]: ${(fireTimer / 60).toFixed(1)}s`, 270, CANVAS_HEIGHT - 15);
            }

            // BARRA 1: AMIGOS
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 10px Courier New';
            ctx.fillText('AMIGOS:', 370, CANVAS_HEIGHT - 15);
            
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(420, CANVAS_HEIGHT - 24, 80, 10);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(420 + 40, CANVAS_HEIGHT - 24, 1, 10);

            let fillPct1 = Math.min(20, friendCount) / 20;
            ctx.fillStyle = friendCount >= 20 ? '#00ffff' : (friendCount >= 10 ? '#0088ff' : '#ffaa00');
            ctx.fillRect(420, CANVAS_HEIGHT - 24, fillPct1 * 80, 10);

            // BARRA 2: SUPER LASER
            if (friendCount >= 20) {
                ctx.fillStyle = '#ff00ff';
                ctx.font = 'bold 10px Courier New';
                ctx.fillText('SUPER:', 515, CANVAS_HEIGHT - 15);

                ctx.strokeStyle = '#ffffff';
                ctx.strokeRect(560, CANVAS_HEIGHT - 24, 80, 10);

                let superProgress = (friendCount - 20) % 10;
                let fillPct2 = friendSpecialTimer > 0 ? (friendSpecialTimer / 300) : (superProgress / 10);

                ctx.fillStyle = friendSpecialTimer > 0 ? '#ffff00' : '#ff00ff';
                ctx.fillRect(560, CANVAS_HEIGHT - 24, fillPct2 * 80, 10);
            }

            // Pause
            if (isPaused && gameState === STATE_PLAYING) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 30px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
                ctx.font = '14px Courier New';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(isMobile ? 'Toque em PAUSE para continuar' : 'Pressione P para continuar', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 30);
                ctx.textAlign = 'left';
            }

            // Game Over
            if (gameState === STATE_GAMEOVER) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 28px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, 100);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Courier New';
                ctx.fillText(`Pontuação Final: ${score}`, CANVAS_WIDTH / 2, 135);

                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 18px Courier New';
                ctx.fillText('--- TOP 5 SCORE ---', CANVAS_WIDTH / 2, 185);

                ctx.font = '14px Courier New';
                highScores.forEach((hs, index) => {
                    let color = hs === score ? '#00ff00' : '#ffffff';
                    ctx.fillStyle = color;
                    ctx.fillText(`${index + 1}º ........... ${hs} PTS`, CANVAS_WIDTH / 2, 225 + (index * 28));
                });

                ctx.fillStyle = '#ffffff';
                ctx.font = '13px Courier New';
                ctx.fillText(isMobile ? 'Toque na tela para voltar ao menu' : 'Pressione CTRL ou ESPAÇO para voltar ao menu', CANVAS_WIDTH / 2, 420);
                ctx.textAlign = 'left';
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
