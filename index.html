<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>River Raid Retro - Special Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            border: 4px solid #fff;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            display: block;
            width: 100%;
            height: auto;
            max-height: 75vh;
            aspect-ratio: 680 / 600;
            touch-action: none;
        }

        .instructions {
            margin-top: 8px;
            font-size: 12px;
            color: #aaa;
        }

        .instructions span {
            color: #fff;
            font-weight: bold;
        }

        /* --- CONTROLES MOBILE / TOUCH --- */
        #mobile-controls {
            display: none;
            width: 100%;
            max-width: 680px;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-top: 5px;
            touch-action: none;
        }

        /* D-Pad Virtual */
        .dpad {
            position: relative;
            width: 130px;
            height: 130px;
        }

        .dpad-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            active-background: rgba(0, 255, 255, 0.5);
        }

        .dpad-btn:active {
            background: rgba(0, 255, 255, 0.4);
        }

        .dpad-up { top: 0; left: 42px; width: 46px; height: 44px; }
        .dpad-down { bottom: 0; left: 42px; width: 46px; height: 44px; }
        .dpad-left { top: 42px; left: 0; width: 44px; height: 46px; }
        .dpad-right { top: 42px; right: 0; width: 44px; height: 46px; }

        /* Botões de Ação */
        .action-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-action {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #fff;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-family: inherit;
        }

        .btn-fire {
            background: rgba(255, 51, 0, 0.7);
            border-color: #ff5500;
        }

        .btn-fire:active {
            background: rgba(255, 51, 0, 1);
        }

        .btn-special {
            background: rgba(0, 204, 255, 0.7);
            border-color: #00ffff;
        }

        .btn-special:active {
            background: rgba(0, 204, 255, 1);
        }

        /* Botão de Pause Mobile */
        .btn-pause-mobile {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #fff;
            color: #fff;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <button id="pauseBtnMobile" class="btn-pause-mobile">║║ PAUSE</button>

        <canvas id="gameCanvas" width="680" height="600"></canvas>
        
        <div id="instructions" class="instructions">
            Controles: <span>← → ↑ ↓</span> Mover | <span>CTRL</span> Atirar | <span>ESPAÇO</span> Especial [S] / Confirmar | <span>P</span> Pause
        </div>

        <!-- LAYOUT CONTROLES MOBILE -->
        <div id="mobile-controls">
            <div class="dpad">
                <div class="dpad-btn dpad-up" id="btnUp">▲</div>
                <div class="dpad-btn dpad-left" id="btnLeft">◄</div>
                <div class="dpad-btn dpad-right" id="btnRight">►</div>
                <div class="dpad-btn dpad-down" id="btnDown">▼</div>
            </div>
            
            <div class="action-buttons">
                <div class="btn-action btn-special" id="btnSpecial">ESP [S]</div>
                <div class="btn-action btn-fire" id="btnFire">TIRO</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_WIDTH = canvas.width;
        const CANVAS_HEIGHT = canvas.height;

        // --- DETECÇÃO AUTOMÁTICA DE MOBILE ---
        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.matchMedia("(pointer: coarse)").matches;

        if (isMobile) {
            document.getElementById('mobile-controls').style.display = 'flex';
            document.getElementById('pauseBtnMobile').style.display = 'block';
            document.getElementById('instructions').innerHTML = 'Controles Touch Ativos! Use o D-Pad ou toque e arraste a nave.';
        }

        // --- ESTADOS DO JOGO ---
        const STATE_MENU = 0;
        const STATE_PLAYING = 1;
        const STATE_CHOICE = 2;
        const STATE_PEACE = 3;
        const STATE_GAMEOVER = 4;
        let gameState = STATE_MENU;

        // Nomes e Temas das 5 Fases
        const STAGE_CONFIG = [
            { id: 1, name: "SUBINDO O RIO", type: "RIVER" },
            { id: 2, name: "CÂNION ESTREITO", type: "CANYON" },
            { id: 3, name: "MAR ABERTO", type: "OCEAN" },
            { id: 4, name: "TEMPESTADE CELESTE", type: "STORM" },
            { id: 5, name: "ESPAÇO PROFUNDO", type: "SPACE" }
        ];

        // Aeronaves disponíveis
        const SHIP_JET = 0;
        const SHIP_HELI = 1;
        const SHIP_UFO = 2;
        const SHIP_SPACESHIP = 3;
        let selectedShip = SHIP_JET;

        // Variáveis Principais
        let score = 0;
        let lastExtraLifeScore = 0;
        let stage = 1;
        let loopMultiplier = 1;
        const SCORE_PER_EXTRA_LIFE = 5000;
        
        const TIME_TO_BOSS_FRAMES = 7200; 
        let stageTimer = 0;

        let stageBannerTimer = 0;
        const BANNER_DURATION = 180;

        let lives = 3;
        let specialsCount = 0;
        let isSpecialActive = false;
        let specialTimer = 0;
        let shieldTimer = 0;

        // SISTEMA DE AMIGOS E ESFERAS [A]
        let friendCount = 0;
        let friendShootCooldownLeft = 0;
        let friendShootCooldownRight = 0;
        let friendSpecialTimer = 0;

        // MODO FIRE [F]
        let fireTimer = 0;
        let activeFireType = null;
        let fireAutoCooldown = 0;

        let isPaused = false;
        let gameSpeed = 3;
        let highScores = JSON.parse(localStorage.getItem('rr_highscores')) || [2000, 1500, 1000, 500, 200];

        let peacePlaneX = -50;
        let victoryAudioInterval = null;
        let activeBoss = null;

        let curveOffset = 0;
        let environmentScroll = 0;
        let islands = [];
        let clouds = [];
        let stars = [];
        let asteroids = [];
        let asteroidDebris = [];

        for (let i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * CANVAS_WIDTH,
                y: Math.random() * CANVAS_HEIGHT,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        // --- ÁUDIO ---
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;
        let audioInitialized = false;

        function initAudio() {
            if (audioInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();

                engineOsc.type = (selectedShip === SHIP_UFO || selectedShip === SHIP_SPACESHIP) ? 'sine' : (selectedShip === SHIP_HELI ? 'triangle' : 'sawtooth');
                engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
                engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);

                engineOsc.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();

                audioInitialized = true;
            } catch (e) {
                console.log("Áudio não suportado");
            }
        }

        function stopVictoryMusic() {
            if (victoryAudioInterval) {
                clearInterval(victoryAudioInterval);
                victoryAudioInterval = null;
            }
        }

        function playVictoryMusicLoop() {
            if (!audioCtx) return;
            stopVictoryMusic();

            const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 523.25, 659.25, 587.33];
            let noteIndex = 0;

            victoryAudioInterval = setInterval(() => {
                if (gameState !== STATE_PEACE) {
                    stopVictoryMusic();
                    return;
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);

                noteIndex = (noteIndex + 1) % notes.length;
            }, 300);
        }

        function playExtraLifeSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08);
            osc.frequency.setValueAtTime(783.99, now + 0.16);
            osc.frequency.setValueAtTime(1046.50, now + 0.24);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playShootSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            if (selectedShip === SHIP_JET) {
                osc.type = 'square';
                osc.frequency.setValueAtTime(650, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.12);
            } else if (selectedShip === SHIP_HELI) {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);
            } else if (selectedShip === SHIP_UFO) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.15);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.18);
            }

            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playHitSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.05);

            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playOrbSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(650, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            whiteNoise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            whiteNoise.start();
        }

        function playSpecialSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = (selectedShip === SHIP_UFO || selectedShip === SHIP_SPACESHIP) ? 'sine' : 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.4);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function updateEngineSound() {
            if (!audioCtx || !engineOsc) return;
            if (isPaused || gameState !== STATE_PLAYING) {
                engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
            } else {
                engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                const baseFreq = (selectedShip === SHIP_UFO || selectedShip === SHIP_SPACESHIP) ? 120 : (selectedShip === SHIP_HELI ? 25 : 35);
                engineOsc.frequency.setValueAtTime(baseFreq + 18, audioCtx.currentTime);
            }
        }

        // --- CONTROLES TECLADO E TOUCH ---
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            ArrowDown: false,
            Control: false,
            Space: false
        };

        const player = {
            x: CANVAS_WIDTH / 2 - 14,
            y: CANVAS_HEIGHT - 100,
            width: 28,
            height: 32,
            speed: 5.5,
            cooldown: 0
        };

        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let friendOrbs = [];
        let specialOrbs = [];
        let fireOrbs = [];
        let particles = [];

        // EVENTOS DE TECLADO
        window.addEventListener('keydown', (e) => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (gameState === STATE_MENU) {
                if (e.key === 'ArrowLeft') selectedShip = (selectedShip + 3) % 4;
                if (e.key === 'ArrowRight') selectedShip = (selectedShip + 1) % 4;
                if (e.code === 'Space' || e.key === 'Control') startGame();
                return;
            }

            if (gameState === STATE_CHOICE) {
                if (e.key === '1') {
                    loopMultiplier += 1;
                    setStage(1);
                    gameState = STATE_PLAYING;
                }
                if (e.key === '2') {
                    gameState = STATE_PEACE;
                    peacePlaneX = -50;
                    playVictoryMusicLoop();
                }
                return;
            }

            if (gameState === STATE_PEACE && (e.code === 'Space' || e.key === 'Control')) {
                stopVictoryMusic();
                gameState = STATE_MENU;
                return;
            }

            if (e.code === 'KeyP') {
                if (gameState === STATE_PLAYING) isPaused = !isPaused;
            }

            if (isPaused) return;

            if (e.key === 'Control') keys.Control = true;
            if (e.code === 'Space') {
                keys.Space = true;
                if (gameState === STATE_PLAYING && stageBannerTimer <= 0) triggerSpecial();
            }
            if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.key === 'ArrowRight') keys.ArrowRight = true;
            if (e.key === 'ArrowUp') keys.ArrowUp = true;
            if (e.key === 'ArrowDown') keys.ArrowDown = true;
            
            if (gameState === STATE_GAMEOVER && (e.code === 'Space' || e.key === 'Control')) {
                gameState = STATE_MENU;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'Control') keys.Control = false;
            if (e.code === 'Space') keys.Space = false;
            if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.key === 'ArrowRight') keys.ArrowRight = false;
            if (e.key === 'ArrowUp') keys.ArrowUp = false;
            if (e.key === 'ArrowDown') keys.ArrowDown = false;
        });

        // VINCULAÇÃO DOS BOTÕES MOBILE (D-Pad e Ação)
        function setupMobileButton(btnId, keyName) {
            const btn = document.getElementById(btnId);
            if (!btn) return;

            const press = (e) => {
                e.preventDefault();
                initAudio();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

                if (gameState === STATE_MENU) {
                    if (keyName === 'ArrowLeft') selectedShip = (selectedShip + 3) % 4;
                    if (keyName === 'ArrowRight') selectedShip = (selectedShip + 1) % 4;
                    if (keyName === 'Control' || keyName === 'Space') startGame();
                    return;
                }

                if (gameState === STATE_CHOICE) {
                    if (keyName === 'ArrowLeft') {
                        loopMultiplier += 1;
                        setStage(1);
                        gameState = STATE_PLAYING;
                    } else if (keyName === 'ArrowRight') {
                        gameState = STATE_PEACE;
                        peacePlaneX = -50;
                        playVictoryMusicLoop();
                    }
                    return;
                }

                if (gameState === STATE_PEACE && (keyName === 'Control' || keyName === 'Space')) {
                    stopVictoryMusic();
                    gameState = STATE_MENU;
                    return;
                }

                if (gameState === STATE_GAMEOVER && (keyName === 'Control' || keyName === 'Space')) {
                    gameState = STATE_MENU;
                    return;
                }

                if (keyName === 'Space' && gameState === STATE_PLAYING && stageBannerTimer <= 0) {
                    triggerSpecial();
                }

                keys[keyName] = true;
            };

            const release = (e) => {
                e.preventDefault();
                keys[keyName] = false;
            };

            btn.addEventListener('touchstart', press);
            btn.addEventListener('touchend', release);
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
        }

        setupMobileButton('btnUp', 'ArrowUp');
        setupMobileButton('btnDown', 'ArrowDown');
        setupMobileButton('btnLeft', 'ArrowLeft');
        setupMobileButton('btnRight', 'ArrowRight');
        setupMobileButton('btnFire', 'Control');
        setupMobileButton('btnSpecial', 'Space');

        document.getElementById('pauseBtnMobile').addEventListener('click', () => {
            if (gameState === STATE_PLAYING) isPaused = !isPaused;
        });

        // MOVIMENTO POR TOUCH DIRECT (Arrastar o dedo na tela)
        let touchDragActive = false;
        let lastTouchX = 0;
        let lastTouchY = 0;

        canvas.addEventListener('touchstart', (e) => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (gameState === STATE_MENU) {
                let rect = canvas.getBoundingClientRect();
                let touchX = (e.touches[0].clientX - rect.left) * (CANVAS_WIDTH / rect.width);
                if (touchX < CANVAS_WIDTH / 2) selectedShip = (selectedShip + 3) % 4;
                else selectedShip = (selectedShip + 1) % 4;
                return;
            }

            if (gameState === STATE_CHOICE || gameState === STATE_PEACE || gameState === STATE_GAMEOVER) {
                if (gameState === STATE_CHOICE) {
                    loopMultiplier += 1;
                    setStage(1);
                    gameState = STATE_PLAYING;
                } else if (gameState === STATE_PEACE) {
                    stopVictoryMusic();
                    gameState = STATE_MENU;
                } else if (gameState === STATE_GAMEOVER) {
                    gameState = STATE_MENU;
                }
                return;
            }

            if (gameState === STATE_PLAYING) {
                touchDragActive = true;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                keys.Control = true; // Auto-tiro ao segurar na tela
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!touchDragActive || gameState !== STATE_PLAYING) return;
            let dx = e.touches[0].clientX - lastTouchX;
            let dy = e.touches[0].clientY - lastTouchY;

            player.x += dx * 1.2;
            player.y += dy * 1.2;

            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', () => {
            touchDragActive = false;
            keys.Control = false;
        });

        function setStage(newStage) {
            stage = newStage;
            stageTimer = 0;
            stageBannerTimer = BANNER_DURATION;
            islands = [];
            clouds = [];
            asteroids = [];
            asteroidDebris = [];
        }

        function startGame() {
            stopVictoryMusic();
            score = 0;
            lastExtraLifeScore = 0;
            loopMultiplier = 1;
            lives = 3;
            friendCount = 0;
            friendShootCooldownLeft = 0;
            friendShootCooldownRight = 0;
            friendSpecialTimer = 0;
            specialsCount = 0;
            isSpecialActive = false;
            specialTimer = 0;
            shieldTimer = 0;
            fireTimer = 0;
            activeFireType = null;
            fireAutoCooldown = 0;
            isPaused = false;
            gameSpeed = 3;
            player.x = CANVAS_WIDTH / 2 - 14;
            player.y = CANVAS_HEIGHT - 100;
            bullets = [];
            enemyBullets = [];
            enemies = [];
            friendOrbs = [];
            specialOrbs = [];
            fireOrbs = [];
            particles = [];
            activeBoss = null;
            
            setStage(1);
            gameState = STATE_PLAYING;

            if (engineOsc) {
                engineOsc.type = (selectedShip === SHIP_UFO || selectedShip === SHIP_SPACESHIP) ? 'sine' : (selectedShip === SHIP_HELI ? 'triangle' : 'sawtooth');
            }
        }

        function triggerSpecial() {
            if (specialsCount > 0 && !isSpecialActive) {
                specialsCount--;
                isSpecialActive = true;
                specialTimer = 120;
                playSpecialSound();
            }
        }

        function saveHighScore(newScore) {
            highScores.push(newScore);
            highScores.sort((a, b) => b - a);
            highScores = highScores.slice(0, 5);
            localStorage.setItem('rr_highscores', JSON.stringify(highScores));
        }

        function addScore(pts) {
            score += pts;
            if (Math.floor(score / SCORE_PER_EXTRA_LIFE) > Math.floor(lastExtraLifeScore / SCORE_PER_EXTRA_LIFE)) {
                lives++;
                playExtraLifeSound();
            }
            lastExtraLifeScore = score;
        }

        function createExplosion(x, y, color) {
            playExplosionSound();
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    color: color || '#ff5500',
                    life: 20
                });
            }
        }

        function getTrackBorders(y) {
            const currentType = STAGE_CONFIG[stage - 1].type;
            
            if (currentType === "RIVER") {
                let baseBank = 70;
                let shift = Math.sin((-y + environmentScroll) * 0.008) * 45 + Math.cos((-y + environmentScroll) * 0.015) * 25;
                let left = baseBank + shift;
                let right = CANVAS_WIDTH - baseBank + shift;
                return { left: Math.max(30, left), right: Math.min(CANVAS_WIDTH - 30, right) };
            } else if (currentType === "CANYON") {
                let baseBank = 170;
                let shift = Math.sin((-y + environmentScroll) * 0.012) * 80 + Math.sin((-y + environmentScroll) * 0.025) * 35;
                let left = baseBank + shift;
                let right = CANVAS_WIDTH - baseBank + shift;
                return { left: Math.max(40, left), right: Math.min(CANVAS_WIDTH - 40, right) };
            } else {
                return { left: 0, right: CANVAS_WIDTH };
            }
        }

        function spawnBoss() {
            const bossWidths = [90, 180, 270, 370, 500];
            const bossHeights = [50, 70, 85, 100, 120];
            const w = bossWidths[stage - 1];
            const h = bossHeights[stage - 1];

            const baseHp = (220 + (stage * 120)) * loopMultiplier;

            activeBoss = {
                x: CANVAS_WIDTH / 2 - w / 2,
                y: -h - 10,
                width: w,
                height: h,
                maxHp: baseHp,
                hp: baseHp,
                speedX: stage === 5 ? 0.8 : (2.4 - (stage * 0.3)),
                cannonsCount: stage,
                layoutType: (stage - 1) % 5,
                shootCycleCooldown: 0,
                currentCannonFiring: 0,
                cannonFireTimer: 0,
                specialCharges: [true, true]
            };
        }

        function triggerBossSpecial(boss) {
            const bx = boss.x + boss.width / 2;
            const by = boss.y + boss.height;
            const targetX = player.x + player.width / 2;
            const targetY = player.y + player.height / 2;

            if (stage === 1) {
                for (let angleOffset of [-0.4, -0.2, 0, 0.2, 0.4]) {
                    let baseAngle = Math.atan2(targetY - by, targetX - bx) + angleOffset;
                    enemyBullets.push({
                        x: bx - 4, y: by, width: 8, height: 14,
                        vx: Math.cos(baseAngle) * 6.5,
                        vy: Math.sin(baseAngle) * 6.5
                    });
                }
            } else if (stage === 2) {
                for (let i = 0; i < 10; i++) {
                    let posX = 40 + i * ((CANVAS_WIDTH - 80) / 9);
                    enemyBullets.push({
                        x: posX, y: boss.y + boss.height, width: 8, height: 14,
                        vx: (i % 2 === 0 ? 1 : -1) * 1.5, vy: 5.2
                    });
                }
            } else if (stage === 3) {
                for (let i = 0; i < 12; i++) {
                    let angle = (i * Math.PI / 6);
                    enemyBullets.push({
                        x: bx - 4, y: by - boss.height / 2, width: 8, height: 8,
                        vx: Math.cos(angle) * 4.8,
                        vy: Math.sin(angle) * 4.8
                    });
                }
            } else if (stage === 4) {
                for (let i = 0; i < 6; i++) {
                    let spawnX = boss.x + 15 + i * ((boss.width - 30) / 5);
                    let angle = Math.atan2(targetY - by, targetX - spawnX);
                    enemyBullets.push({
                        x: spawnX, y: by, width: 8, height: 14,
                        vx: Math.cos(angle) * 5.8,
                        vy: Math.sin(angle) * 5.8
                    });
                }
            } else if (stage === 5) {
                for (let i = 0; i < 16; i++) {
                    let posX = 15 + (i * (CANVAS_WIDTH - 30) / 15);
                    enemyBullets.push({
                        x: posX, y: boss.y + boss.height, width: 10, height: 16,
                        vx: (Math.random() - 0.5) * 2.5,
                        vy: 6.0
                    });
                }
            }

            playExplosionSound();
        }

        function spawnEntities() {
            if (activeBoss || stageBannerTimer > 0) return;

            if (stageTimer >= TIME_TO_BOSS_FRAMES) {
                spawnBoss();
                return;
            }

            const currentType = STAGE_CONFIG[stage - 1].type;

            if (Math.random() < 0.022) {
                const rand = Math.random();
                let type = 'ship';
                if (rand > 0.66) type = 'monster';
                else if (rand > 0.33) type = 'miniufo';

                const x = Math.random() * (CANVAS_WIDTH - 80) + 40;
                const speedDir = Math.random() > 0.5 ? 1 : -1;
                
                const baseHp = (type === 'monster' ? 3 : 2) + Math.floor((loopMultiplier - 1) * 2);
                const shotsAllowed = loopMultiplier;

                enemies.push({
                    x: x,
                    y: -40,
                    width: type === 'ship' ? 36 : (type === 'miniufo' ? 24 : 30),
                    height: type === 'monster' ? 28 : 20,
                    type: type,
                    speedX: type === 'monster' ? 0 : (type === 'ship' ? speedDir * 1.2 : speedDir * 2.0),
                    maxHp: baseHp,
                    hp: baseHp,
                    hitFlash: 0,
                    shootCooldown: type === 'monster' ? 35 : 40,
                    maxShots: shotsAllowed,
                    shotsFired: 0,
                    auraTimer: Math.random() * 100,
                    zigzagTimer: 0,
                    isFrozen: false,
                    frozenTimer: 0,
                    burnTimer: 0,
                    burnTicksLeft: 0
                });
            }

            if (currentType === "OCEAN" && Math.random() < 0.008) {
                islands.push({
                    x: Math.random() * (CANVAS_WIDTH - 120) + 40,
                    y: -100,
                    width: Math.random() * 40 + 50,
                    height: Math.random() * 40 + 50
                });
            }

            if (currentType === "STORM" && Math.random() < 0.02) {
                clouds.push({
                    x: Math.random() * (CANVAS_WIDTH - 150),
                    y: -120,
                    width: Math.random() * 80 + 100,
                    height: Math.random() * 50 + 60,
                    speed: Math.random() * 2 + 2
                });
            }

            if (currentType === "SPACE" && Math.random() < 0.012) {
                asteroids.push({
                    x: Math.random() * (CANVAS_WIDTH - 40) + 20,
                    y: -50,
                    size: Math.random() * 10 + 20,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: Math.random() * 2 + 2,
                    angle: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.05,
                    hp: 5
                });
            }

            if (Math.random() < 0.01) {
                const x = Math.random() * (CANVAS_WIDTH - 80) + 40;
                friendOrbs.push({ x: x, y: -30, radius: 12, width: 24, height: 24 });
            }

            if (Math.random() < 0.002) {
                const x = Math.random() * (CANVAS_WIDTH - 80) + 40;
                specialOrbs.push({ x: x, y: -30, radius: 12, width: 24, height: 24 });
            }

            if (Math.random() < 0.0025) {
                const x = Math.random() * (CANVAS_WIDTH - 80) + 40;
                fireOrbs.push({ x: x, y: -30, radius: 12, width: 24, height: 24 });
            }
        }

        function getClosestTarget(x, y) {
            let target = null;
            let minDist = Infinity;

            if (activeBoss) {
                let bx = activeBoss.x + activeBoss.width / 2;
                let by = activeBoss.y + activeBoss.height / 2;
                return { x: bx, y: by, ref: activeBoss, isBoss: true };
            }

            enemies.forEach(e => {
                if (e.y > 0 && e.y < CANVAS_HEIGHT) {
                    let ex = e.x + e.width / 2;
                    let ey = e.y + e.height / 2;
                    let dist = Math.hypot(ex - x, ey - y);
                    if (dist < minDist) {
                        minDist = dist;
                        target = { x: ex, y: ey, ref: e, isBoss: false };
                    }
                }
            });

            return target;
        }

        function update() {
            updateEngineSound();

            if (gameState !== STATE_PLAYING || isPaused) return;

            if (stageBannerTimer > 0) stageBannerTimer--;

            environmentScroll += gameSpeed;

            if (!activeBoss && stageBannerTimer <= 0) stageTimer++;

            if (isSpecialActive) {
                specialTimer--;
                if (specialTimer <= 0) isSpecialActive = false;
            }

            if (friendSpecialTimer > 0) friendSpecialTimer--;
            if (shieldTimer > 0) shieldTimer--;
            if (fireTimer > 0) fireTimer--;

            // MOVIMENTAÇÃO NAVE
            if (keys.ArrowLeft) player.x -= player.speed;
            if (keys.ArrowRight) player.x += player.speed;
            if (keys.ArrowUp) player.y -= player.speed;
            if (keys.ArrowDown) player.y += player.speed;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > CANVAS_WIDTH) player.x = CANVAS_WIDTH - player.width;
            if (player.y < 40) player.y = 40;
            if (player.y + player.height > CANVAS_HEIGHT - 45) player.y = CANVAS_HEIGHT - 45 - player.height;

            if (player.cooldown > 0) player.cooldown--;
            if (fireAutoCooldown > 0) fireAutoCooldown--;

            // TIROS NORMAIS DA NAVE
            if (keys.Control && player.cooldown === 0 && !isSpecialActive && stageBannerTimer <= 0) {
                if (selectedShip === SHIP_JET) {
                    bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 10, speed: 8.5, vx: 0, damage: 1 });
                    bullets.push({ x: player.x, y: player.y + 4, width: 4, height: 10, speed: 8, vx: -2.5, damage: 1 });
                    bullets.push({ x: player.x + player.width - 4, y: player.y + 4, width: 4, height: 10, speed: 8, vx: 2.5, damage: 1 });
                } else if (selectedShip === SHIP_HELI) {
                    bullets.push({ x: player.x + 2, y: player.y, width: 4, height: 8, speed: 8, vx: 0, damage: 1 });
                    bullets.push({ x: player.x + player.width - 6, y: player.y, width: 4, height: 8, speed: 8, vx: 0, damage: 1 });
                } else if (selectedShip === SHIP_UFO) {
                    bullets.push({ x: player.x + 4, y: player.y, width: 6, height: 8, speed: 7.5, wave: true, waveStep: 0, damage: 1 });
                    bullets.push({ x: player.x + player.width - 10, y: player.y, width: 6, height: 8, speed: 7.5, wave: true, waveStep: 0, damage: 1 });
                } else if (selectedShip === SHIP_SPACESHIP) {
                    bullets.push({ x: player.x + player.width / 2 - 2, y: player.y - 10, width: 4, height: 38, speed: 9, vx: 0, damage: 3 });
                }
                
                player.cooldown = 10;
                playShootSound();
            }

            // DISPAROS AUTOMÁTICOS DOS AMIGOS
            const hasLeftFriend = friendCount >= 10;
            const hasRightFriend = friendCount >= 20;

            if (friendShootCooldownLeft > 0) friendShootCooldownLeft--;
            if (friendShootCooldownRight > 0) friendShootCooldownRight--;

            if (hasLeftFriend && friendShootCooldownLeft <= 0 && stageBannerTimer <= 0) {
                bullets.push({ x: player.x - 15, y: player.y + 8, width: 4, height: 10, speed: 8.5, vx: 0, damage: 1 });
                friendShootCooldownLeft = 15;
            }

            if (hasRightFriend && friendShootCooldownRight <= 0 && stageBannerTimer <= 0) {
                bullets.push({ x: player.x + player.width + 11, y: player.y + 8, width: 4, height: 10, speed: 8.5, vx: 0, damage: 1 });
                friendShootCooldownRight = 15;
            }

            // DISPARO AUTOMÁTICO DO BÔNUS FIRE [F]
            if (fireTimer > 0 && fireAutoCooldown === 0 && activeFireType && stageBannerTimer <= 0) {
                bullets.push({
                    x: player.x + player.width / 2 - 4,
                    y: player.y - 10,
                    width: 8,
                    height: 12,
                    speed: 8.5,
                    isHoming: true,
                    fireType: activeFireType,
                    damage: 1
                });
                fireAutoCooldown = 18;
                playShootSound();
            }

            // Movimentação Tiros
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                if (b.isHoming) {
                    let target = getClosestTarget(b.x, b.y);
                    if (target) {
                        let angle = Math.atan2(target.y - b.y, target.x - b.x);
                        b.x += Math.cos(angle) * b.speed;
                        b.y += Math.sin(angle) * b.speed;
                    } else {
                        b.y -= b.speed;
                    }
                } else {
                    b.y -= b.speed;
                    if (b.vx) b.x += b.vx;
                    if (b.wave) {
                        b.waveStep += 0.2;
                        b.x += Math.sin(b.waveStep) * 3;
                    }
                }

                if (b.y < -40 || b.y > CANVAS_HEIGHT || b.x < 0 || b.x > CANVAS_WIDTH) {
                    bullets.splice(i, 1);
                }
            }

            // ATUALIZAÇÃO CENÁRIOS
            for (let i = islands.length - 1; i >= 0; i--) {
                islands[i].y += gameSpeed;
                if (islands[i].y > CANVAS_HEIGHT + 100) islands.splice(i, 1);
            }

            for (let i = clouds.length - 1; i >= 0; i--) {
                clouds[i].y += clouds[i].speed;
                if (clouds[i].y > CANVAS_HEIGHT + 120) clouds.splice(i, 1);
            }

            // ASTEROIDES (5 TIROS PARA DESPEDAÇAR)
            for (let i = asteroids.length - 1; i >= 0; i--) {
                let ast = asteroids[i];
                ast.y += ast.vy;
                ast.x += ast.vx;
                ast.angle += ast.rotSpeed;

                let astBox = { x: ast.x - ast.size, y: ast.y - ast.size, width: ast.size * 2, height: ast.size * 2 };

                if (checkCollision(player, astBox) && shieldTimer <= 0 && !isSpecialActive) {
                    createExplosion(ast.x, ast.y, '#aaaaaa');
                    handlePlayerDeath();
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (checkCollision(b, astBox)) {
                        bullets.splice(j, 1);
                        ast.hp -= b.damage || 1;
                        createExplosion(b.x, b.y, '#888888');

                        if (ast.hp <= 0) {
                            createExplosion(ast.x, ast.y, '#ffffff');
                            addScore(50);

                            for (let d = 0; d < 4; d++) {
                                asteroidDebris.push({
                                    x: ast.x,
                                    y: ast.y,
                                    size: ast.size * 0.35,
                                    vx: (Math.random() - 0.5) * 4,
                                    vy: (Math.random() - 0.5) * 4 + 1,
                                    angle: Math.random() * Math.PI,
                                    rotSpeed: (Math.random() - 0.5) * 0.1
                                });
                            }

                            asteroids.splice(i, 1);
                            break;
                        }
                    }
                }

                if (ast && ast.y > CANVAS_HEIGHT + 60) asteroids.splice(i, 1);
            }

            // DETRITOS DE ASTEROIDES INOFENSIVOS
            for (let i = asteroidDebris.length - 1; i >= 0; i--) {
                let deb = asteroidDebris[i];
                deb.x += deb.vx;
                deb.y += deb.vy;
                deb.angle += deb.rotSpeed;
                if (deb.y > CANVAS_HEIGHT + 40 || deb.y < -40 || deb.x < -40 || deb.x > CANVAS_WIDTH + 40) {
                    asteroidDebris.splice(i, 1);
                }
            }

            // SUPER LASER DOS AMIGOS
            if (friendSpecialTimer > 0) {
                const laserDamage = 0.4;
                let friendLeftX = player.x - 22;
                let friendRightX = player.x + player.width + 5;
                let friendY = player.y + 8;

                let boxLeft = { x: friendLeftX + 3, y: 0, width: 12, height: friendY };
                let boxRight = { x: friendRightX + 3, y: 0, width: 12, height: friendY };

                enemies.forEach(e => {
                    if (checkCollision(boxLeft, e) || checkCollision(boxRight, e)) {
                        e.hp -= laserDamage;
                        e.hitFlash = 3;
                        addScore(2);
                    }
                });

                if (activeBoss) {
                    if (checkCollision(boxLeft, activeBoss) || checkCollision(boxRight, activeBoss)) {
                        activeBoss.hp -= laserDamage;
                    }
                }
            }

            // TIROS INIMIGOS
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.y += eb.vy;
                eb.x += eb.vx;

                if (isSpecialActive) {
                    let specialHit = false;
                    if (selectedShip === SHIP_JET) {
                        let centerBox = { x: player.x, y: 0, width: player.width, height: player.y };
                        let leftDiag = checkLineCollision(player.x, player.y, player.x - 250, 0, eb);
                        let rightDiag = checkLineCollision(player.x + player.width, player.y, player.x + player.width + 250, 0, eb);
                        if (checkCollision(centerBox, eb) || leftDiag || rightDiag) specialHit = true;
                    } else if (selectedShip === SHIP_HELI) {
                        let heliBox = { x: player.x - 10, y: 0, width: player.width + 20, height: player.y };
                        if (checkCollision(heliBox, eb)) specialHit = true;
                    } else if (selectedShip === SHIP_UFO) {
                        let ufoBox = { x: player.x - 80, y: 0, width: player.width + 160, height: player.y };
                        if (checkCollision(ufoBox, eb)) specialHit = true;
                    } else if (selectedShip === SHIP_SPACESHIP) {
                        let spaceshipBox = { x: player.x - 30, y: 0, width: player.width + 60, height: player.y };
                        if (checkCollision(spaceshipBox, eb)) specialHit = true;
                    }

                    if (specialHit) {
                        createExplosion(eb.x, eb.y, '#00ffff');
                        enemyBullets.splice(i, 1);
                        continue;
                    }
                }

                if (checkCollision(eb, player)) {
                    if (shieldTimer > 0) {
                        createExplosion(eb.x, eb.y, '#00ffff');
                        enemyBullets.splice(i, 1);
                        continue;
                    }

                    if (!isSpecialActive) {
                        createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#ff0000');
                        enemyBullets.splice(i, 1);
                        handlePlayerDeath();
                        continue;
                    } else {
                        createExplosion(eb.x, eb.y, '#00ffff');
                        enemyBullets.splice(i, 1);
                        continue;
                    }
                }

                if (eb.y > CANVAS_HEIGHT || eb.y < -50 || eb.x < 0 || eb.x > CANVAS_WIDTH) {
                    enemyBullets.splice(i, 1);
                }
            }

            // ATUALIZAÇÃO CHEFÃO
            if (activeBoss) {
                if (activeBoss.y < 35) activeBoss.y += 1.2;
                activeBoss.x += activeBoss.speedX;

                if (activeBoss.x <= 20 || activeBoss.x + activeBoss.width >= CANVAS_WIDTH - 20) {
                    activeBoss.speedX *= -1;
                }

                let hpPct = activeBoss.hp / activeBoss.maxHp;

                if (activeBoss.specialCharges[0] && hpPct <= 0.70 && hpPct >= 0.55) {
                    activeBoss.specialCharges[0] = false;
                    triggerBossSpecial(activeBoss);
                }

                if (activeBoss.specialCharges[1] && hpPct <= 0.30 && hpPct >= 0.15) {
                    activeBoss.specialCharges[1] = false;
                    triggerBossSpecial(activeBoss);
                }

                if (activeBoss.currentCannonFiring > 0) {
                    activeBoss.cannonFireTimer--;
                    if (activeBoss.cannonFireTimer <= 0) {
                        const count = activeBoss.cannonsCount;
                        const spacing = activeBoss.width / (count + 1);
                        let cannonIndex = activeBoss.currentCannonFiring;
                        let cannonX = activeBoss.x + (spacing * cannonIndex);
                        let cannonY = activeBoss.y + activeBoss.height;

                        let targetX = player.x + player.width / 2;
                        let targetY = player.y + player.height / 2;
                        let angle = Math.atan2(targetY - cannonY, targetX - cannonX);
                        let bulletSpeed = 4.8;

                        enemyBullets.push({
                            x: cannonX - 3,
                            y: cannonY,
                            width: 6,
                            height: 12,
                            vx: Math.cos(angle) * bulletSpeed,
                            vy: Math.sin(angle) * bulletSpeed
                        });

                        activeBoss.currentCannonFiring++;
                        if (activeBoss.currentCannonFiring > count) {
                            activeBoss.currentCannonFiring = 0;
                            activeBoss.shootCycleCooldown = Math.max(40, 80 - (stage * 5));
                        } else {
                            activeBoss.cannonFireTimer = 8;
                        }
                    }
                } else {
                    activeBoss.shootCycleCooldown--;
                    if (activeBoss.shootCycleCooldown <= 0) {
                        activeBoss.currentCannonFiring = 1;
                        activeBoss.cannonFireTimer = 0;
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (checkCollision(b, activeBoss)) {
                        createExplosion(b.x, b.y, '#ffaa00');

                        if (b.fireType === 'MISSILE') {
                            activeBoss.hp -= 5;
                            createExplosion(b.x, b.y, '#ff3300');
                        } else if (b.fireType === 'ICE') {
                            activeBoss.hp -= Math.floor(activeBoss.hp / 2);
                            createExplosion(b.x, b.y, '#00ffff');
                        } else if (b.fireType === 'FIREBALL') {
                            activeBoss.hp -= 5;
                            createExplosion(b.x, b.y, '#ffaa00');
                        } else {
                            activeBoss.hp -= b.damage || 1;
                        }

                        bullets.splice(j, 1);

                        if (activeBoss.hp <= 0) {
                            createExplosion(activeBoss.x + activeBoss.width / 2, activeBoss.y + activeBoss.height / 2, '#ffff00');
                            activeBoss = null;

                            if (stage >= 5) {
                                gameState = STATE_CHOICE;
                            } else {
                                setStage(stage + 1);
                            }
                            break;
                        }
                    }
                }

                if (activeBoss && isSpecialActive) {
                    activeBoss.hp -= 0.35;
                    if (activeBoss.hp <= 0) {
                        createExplosion(activeBoss.x + activeBoss.width / 2, activeBoss.y + activeBoss.height / 2, '#ffff00');
                        activeBoss = null;

                        if (stage >= 5) {
                            gameState = STATE_CHOICE;
                        } else {
                            setStage(stage + 1);
                        }
                    }
                }

                if (activeBoss && checkCollision(player, activeBoss) && shieldTimer <= 0 && !isSpecialActive) {
                    createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#ff0000');
                    handlePlayerDeath();
                }
            }

            // ESPECIAIS ATIVOS
            if (isSpecialActive) {
                const damagePerFrame = 0.35;

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let hit = false;
                    let e = enemies[i];

                    if (selectedShip === SHIP_JET) {
                        let centerBox = { x: player.x, y: 0, width: player.width, height: player.y };
                        let leftDiag = checkLineCollision(player.x, player.y, player.x - 250, 0, e);
                        let rightDiag = checkLineCollision(player.x + player.width, player.y, player.x + player.width + 250, 0, e);
                        if (checkCollision(centerBox, e) || leftDiag || rightDiag) hit = true;
                    } else if (selectedShip === SHIP_HELI) {
                        let heliBox = { x: player.x - 10, y: 0, width: player.width + 20, height: player.y };
                        if (checkCollision(heliBox, e)) hit = true;
                    } else if (selectedShip === SHIP_UFO) {
                        let ufoBox = { x: player.x - 80, y: 0, width: player.width + 160, height: player.y };
                        if (checkCollision(ufoBox, e)) hit = true;
                    } else if (selectedShip === SHIP_SPACESHIP) {
                        let spaceshipBox = { x: player.x - 30, y: 0, width: player.width + 60, height: player.y };
                        if (checkCollision(spaceshipBox, e)) hit = true;
                    }

                    if (hit) {
                        e.hp -= damagePerFrame;
                        e.hitFlash = 3;
                        addScore(5);
                        if (e.hp <= 0) {
                            createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#00ffff');
                            addScore(50);
                            enemies.splice(i, 1);
                        }
                    }
                }
            }

            // INIMIGOS NORMAIS
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];

                if (e.isFrozen) {
                    e.frozenTimer--;
                    if (e.frozenTimer <= 0) e.isFrozen = false;
                } else {
                    e.y += gameSpeed;
                    e.auraTimer += 0.05;
                }

                if (e.burnTicksLeft > 0) {
                    e.burnTimer--;
                    if (e.burnTimer <= 0) {
                        e.hp -= 1;
                        e.hitFlash = 4;
                        e.burnTicksLeft--;
                        e.burnTimer = 30;
                        createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#ff6600');
                        if (e.hp <= 0) {
                            createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#ffaa00');
                            addScore(e.type === 'ship' ? 50 : (e.type === 'monster' ? 100 : 80));
                            enemies.splice(i, 1);
                            continue;
                        }
                    }
                }

                if (e.hitFlash > 0) e.hitFlash--;

                if (!e.isFrozen) {
                    e.shootCooldown--;
                    if (e.shootCooldown <= 0 && e.shotsFired < e.maxShots && e.y > 10 && e.y < CANVAS_HEIGHT - 60) {
                        let targetX = player.x + player.width / 2;
                        let targetY = player.y + player.height / 2;
                        let startX = e.x + e.width / 2;
                        let startY = e.y + e.height;

                        let angle = Math.atan2(targetY - startY, targetX - startX);
                        let projSpeed = 4.0;

                        enemyBullets.push({
                            x: startX - 3,
                            y: startY,
                            width: 6,
                            height: 12,
                            vx: Math.cos(angle) * projSpeed,
                            vy: Math.sin(angle) * projSpeed
                        });

                        e.shotsFired++;
                        e.shootCooldown = 25;
                    }
                }

                if (e.type === 'ship' && !e.isFrozen) {
                    e.x += e.speedX;
                    if (e.x <= 10 || e.x + e.width >= CANVAS_WIDTH - 10) e.speedX *= -1;
                }

                if (e.type === 'miniufo' && !e.isFrozen) {
                    e.zigzagTimer += 0.08;
                    e.x += Math.sin(e.zigzagTimer) * 3.5;

                    if (e.x <= 10) e.x = 10;
                    if (e.x + e.width >= CANVAS_WIDTH - 10) e.x = CANVAS_WIDTH - 10 - e.width;

                    let isAuraActive = Math.sin(e.auraTimer * 2) > 0;
                    if (isAuraActive) {
                        let auraRadius = 24;
                        let auraBox = {
                            x: e.x - (auraRadius - e.width / 2),
                            y: e.y - (auraRadius - e.height / 2),
                            width: auraRadius * 2,
                            height: auraRadius * 2
                        };
                        if (checkCollision(auraBox, player) && !isSpecialActive && shieldTimer <= 0) {
                            createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#00ffff');
                            handlePlayerDeath();
                        }
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (checkCollision(b, e)) {
                        bullets.splice(j, 1);
                        e.hitFlash = 5;
                        playHitSound();
                        addScore(20);

                        if (b.fireType === 'MISSILE') {
                            e.hp -= 5;
                            createExplosion(b.x, b.y, '#ff3300');
                        } else if (b.fireType === 'ICE') {
                            e.isFrozen = true;
                            e.frozenTimer = 120;
                            e.hp = Math.max(1, Math.floor(e.hp / 2));
                            createExplosion(b.x, b.y, '#00ffff');
                        } else if (b.fireType === 'FIREBALL') {
                            e.burnTicksLeft = 5;
                            e.burnTimer = 1;
                            createExplosion(b.x, b.y, '#ff6600');
                        } else {
                            e.hp -= b.damage || 1;
                        }

                        if (e.hp <= 0) {
                            createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#ffaa00');
                            addScore(e.type === 'ship' ? 50 : (e.type === 'monster' ? 100 : 80));
                            enemies.splice(i, 1);
                        }
                        break;
                    }
                }

                if (e && checkCollision(player, e)) {
                    if (shieldTimer > 0) {
                        createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#00ffff');
                        enemies.splice(i, 1);
                    } else if (!isSpecialActive) {
                        createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#ff0000');
                        enemies.splice(i, 1);
                        handlePlayerDeath();
                    } else {
                        createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#00ffff');
                        enemies.splice(i, 1);
                    }
                }

                if (e && e.y > CANVAS_HEIGHT) enemies.splice(i, 1);
            }

            // ESFERAS [A]
            for (let i = friendOrbs.length - 1; i >= 0; i--) {
                let orb = friendOrbs[i];
                orb.y += gameSpeed;

                if (checkCollision(player, orb)) {
                    friendCount++;
                    if (friendCount >= 30 && (friendCount - 20) % 10 === 0) {
                        friendSpecialTimer = 300;
                        playSpecialSound();
                    }
                    addScore(50);
                    playOrbSound();
                    friendOrbs.splice(i, 1);
                    continue;
                }

                if (orb.y > CANVAS_HEIGHT) friendOrbs.splice(i, 1);
            }

            // ESFERAS [S]
            for (let i = specialOrbs.length - 1; i >= 0; i--) {
                let orb = specialOrbs[i];
                orb.y += gameSpeed;

                if (checkCollision(player, orb)) {
                    specialsCount++;
                    addScore(50);
                    playOrbSound();
                    specialOrbs.splice(i, 1);
                    continue;
                }

                if (orb.y > CANVAS_HEIGHT) specialOrbs.splice(i, 1);
            }

            // ESFERAS [F]
            for (let i = fireOrbs.length - 1; i >= 0; i--) {
                let orb = fireOrbs[i];
                orb.y += gameSpeed;

                if (checkCollision(player, orb)) {
                    const fireTypes = ['MISSILE', 'ICE', 'FIREBALL'];
                    activeFireType = fireTypes[Math.floor(Math.random() * fireTypes.length)];
                    fireTimer = 300;
                    fireAutoCooldown = 0;
                    addScore(50);
                    playOrbSound();
                    fireOrbs.splice(i, 1);
                    continue;
                }

                if (orb.y > CANVAS_HEIGHT) fireOrbs.splice(i, 1);
            }

            // Partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            spawnEntities();
        }

        function checkLineCollision(x1, y1, x2, y2, rect) {
            let minX = Math.min(x1, x2);
            let maxX = Math.max(x1, x2);
            return rect.x + rect.width >= minX && rect.x <= maxX && rect.y + rect.height >= 0 && rect.y <= y1;
        }

        function handlePlayerDeath() {
            createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#ffffff');
            lives--;
            friendCount = 0;
            friendSpecialTimer = 0;

            if (lives <= 0) {
                gameState = STATE_GAMEOVER;
                saveHighScore(score);
            } else {
                player.x = CANVAS_WIDTH / 2 - 14;
                player.y = CANVAS_HEIGHT - 100;
                shieldTimer = 180;
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function drawShipSprite(type, x, y, isMini = false) {
            ctx.save();
            ctx.translate(x, y);
            if (isMini) ctx.scale(0.6, 0.6);

            if (type === SHIP_JET) {
                ctx.fillStyle = '#cccccc';
                ctx.fillRect(12, 0, 4, 32);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(13, -4, 2, 4);
                ctx.fillStyle = '#999999';
                ctx.beginPath();
                ctx.moveTo(14, 8);
                ctx.lineTo(0, 26);
                ctx.lineTo(12, 26);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(14, 8);
                ctx.lineTo(28, 26);
                ctx.lineTo(16, 26);
                ctx.fill();
                ctx.fillStyle = '#ff3300';
                ctx.fillRect(12, 8, 4, 8);
            } else if (type === SHIP_HELI) {
                ctx.fillStyle = '#888888';
                ctx.fillRect(8, 6, 12, 22);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(2, 4, 24, 3);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(6, 12, 16, 8);
                ctx.fillStyle = '#000000';
                ctx.fillRect(10, 8, 8, 4);
            } else if (type === SHIP_UFO) {
                ctx.beginPath();
                ctx.ellipse(14, 16, 14, 8, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#ff00ff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(14, 12, 7, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffff';
                ctx.fill();
            } else if (type === SHIP_SPACESHIP) {
                ctx.fillStyle = '#8e44ad';
                ctx.beginPath();
                ctx.moveTo(14, 0);
                ctx.lineTo(0, 22);
                ctx.lineTo(28, 22);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#2980b9';
                ctx.beginPath();
                ctx.arc(14, 22, 14, 0, Math.PI);
                ctx.fill();

                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.arc(14, 12, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawBossLayout(boss) {
            const x = boss.x;
            const y = boss.y;
            const w = boss.width;
            const h = boss.height;

            if (boss.layoutType === 0) {
                ctx.fillStyle = '#c0392b';
                ctx.beginPath();
                ctx.moveTo(x + w / 2, y + h);
                ctx.lineTo(x, y + 10);
                ctx.lineTo(x + 15, y);
                ctx.lineTo(x + w - 15, y);
                ctx.lineTo(x + w, y + 10);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(x + w / 2 - 8, y + 12, 16, 15);
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(x + 10, y + 5, 12, 18);
                ctx.fillRect(x + w - 22, y + 5, 12, 18);
            } else if (boss.layoutType === 1) {
                ctx.fillStyle = '#8e44ad';
                ctx.fillRect(x + 20, y, w - 40, h);

                ctx.fillStyle = '#9b59b6';
                ctx.beginPath();
                ctx.moveTo(x, y + 15);
                ctx.lineTo(x + 30, y + 5);
                ctx.lineTo(x + 30, y + h - 5);
                ctx.lineTo(x, y + h - 15);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(x + w, y + 15);
                ctx.lineTo(x + w - 30, y + 5);
                ctx.lineTo(x + w - 30, y + h - 5);
                ctx.lineTo(x + w, y + h - 15);
                ctx.fill();

                ctx.fillStyle = '#00ffff';
                ctx.fillRect(x + w / 2 - 12, y + 15, 24, 12);
            } else if (boss.layoutType === 2) {
                ctx.fillStyle = '#27ae60';
                ctx.beginPath();
                ctx.moveTo(x + w / 2, y + h);
                ctx.lineTo(x + w - 20, y + h - 15);
                ctx.lineTo(x + w, y + 20);
                ctx.lineTo(x + w / 2, y);
                ctx.lineTo(x, y + 20);
                ctx.lineTo(x + 20, y + h - 15);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(x + 30, y + 15, w - 60, h - 30);
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(x + w / 2, y + h / 2, 14, 0, Math.PI * 2);
                ctx.fill();
            } else if (boss.layoutType === 3) {
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(x + 40, y + 10, w - 80, h - 10);

                ctx.fillStyle = '#34495e';
                ctx.beginPath();
                ctx.moveTo(x, y + 30);
                ctx.lineTo(x + 40, y);
                ctx.lineTo(x + 40, y + h);
                ctx.lineTo(x + 10, y + h);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(x + w, y + 30);
                ctx.lineTo(x + w - 40, y);
                ctx.lineTo(x + w - 40, y + h);
                ctx.lineTo(x + w - 10, y + h);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#e67e22';
                ctx.fillRect(x + w / 2 - 30, y + 20, 60, 20);
            } else {
                ctx.fillStyle = '#16a085';
                ctx.fillRect(x, y + 15, w, h - 30);

                ctx.fillStyle = '#1abc9c';
                ctx.beginPath();
                ctx.moveTo(x + w / 2, y + h);
                ctx.lineTo(x + 60, y + 10);
                ctx.lineTo(x + w - 60, y + 10);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#f39c12';
                for (let i = 0; i < 7; i++) {
                    ctx.fillRect(x + 40 + i * (w - 80) / 6, y + 25, 14, 14);
                }

                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(x + w / 2 - 25, y + 45, 50, 25);
            }

            const count = boss.cannonsCount;
            const spacing = w / (count + 1);

            for (let c = 1; c <= count; c++) {
                let cannonX = x + (spacing * c);
                ctx.fillStyle = (boss.currentCannonFiring === c) ? '#ffff00' : '#ff3300';
                ctx.fillRect(cannonX - 6, y + h - 6, 12, 6);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(cannonX - 3, y + h, 6, 10);
            }
        }

        function drawPeaceScreen() {
            let grad = ctx.createLinearGradient(0, 0, 0, 380);
            grad.addColorStop(0, '#ff4e50');
            grad.addColorStop(0.5, '#f9d423');
            grad.addColorStop(1, '#e15f41');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, CANVAS_WIDTH, 380);

            ctx.fillStyle = '#ff3838';
            ctx.beginPath();
            ctx.arc(CANVAS_WIDTH / 2, 280, 75, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#303952';
            ctx.fillRect(0, 320, CANVAS_WIDTH, 80);

            ctx.fillStyle = 'rgba(249, 212, 35, 0.4)';
            ctx.fillRect(CANVAS_WIDTH / 2 - 50, 320, 100, 80);

            ctx.fillStyle = '#f7d794';
            ctx.fillRect(0, 380, CANVAS_WIDTH, 220);

            function drawPalmTree(x, y) {
                ctx.fillStyle = '#546de5';
                ctx.fillRect(x, y - 60, 8, 60);
                ctx.fillStyle = '#574b90';
                ctx.beginPath();
                ctx.arc(x + 4, y - 65, 25, 0, Math.PI * 2);
                ctx.fill();
            }

            drawPalmTree(50, 420);
            drawPalmTree(100, 400);
            drawPalmTree(CANVAS_WIDTH - 80, 410);

            ctx.fillStyle = '#222';
            for (let i = 0; i < 35; i++) {
                let px = 70 + i * 16;
                let py = 450 + Math.sin(i * 1.5 + Date.now() * 0.008) * 4;
                ctx.fillRect(px, py, 6, 14);
                ctx.beginPath();
                ctx.arc(px + 3, py - 3, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(px - 2, py - 4, 3, 6);
                ctx.fillRect(px + 5, py - 4, 3, 6);
            }

            peacePlaneX += 2;
            if (peacePlaneX > CANVAS_WIDTH + 50) peacePlaneX = -50;
            drawShipSprite(selectedShip, peacePlaneX, 120);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 26px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('A PAZ FOI PROMOVIDA!', CANVAS_WIDTH / 2, 50);

            ctx.font = 'bold 16px Courier New';
            ctx.fillStyle = '#ffff00';
            ctx.fillText('A GUERRA CHEGOU AO FIM!', CANVAS_WIDTH / 2, 80);

            ctx.fillStyle = '#222';
            ctx.font = '13px Courier New';
            ctx.fillText(`PONTUAÇÃO FINAL DE HERÓI: ${score} PTS`, CANVAS_WIDTH / 2, 530);
            ctx.fillText(isMobile ? 'Toque na tela para retornar ao Menu' : 'Pressione CTRL ou ESPAÇO para retornar ao Menu', CANVAS_WIDTH / 2, 560);
            ctx.textAlign = 'left';
        }

        function drawEnvironment() {
            const currentType = STAGE_CONFIG[stage - 1].type;

            if (currentType === "RIVER") {
                ctx.fillStyle = '#0000aa';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = '#00aa00';
                ctx.beginPath();
                for (let y = 0; y <= CANVAS_HEIGHT; y += 10) {
                    let borders = getTrackBorders(y);
                    if (y === 0) ctx.moveTo(0, y);
                    ctx.lineTo(borders.left, y);
                }
                ctx.lineTo(0, CANVAS_HEIGHT);
                ctx.fill();

                ctx.beginPath();
                for (let y = 0; y <= CANVAS_HEIGHT; y += 10) {
                    let borders = getTrackBorders(y);
                    if (y === 0) ctx.moveTo(CANVAS_WIDTH, y);
                    ctx.lineTo(borders.right, y);
                }
                ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fill();

                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 4;
                ctx.beginPath();
                for (let y = 0; y <= CANVAS_HEIGHT; y += 10) {
                    let borders = getTrackBorders(y);
                    if (y === 0) ctx.moveTo(borders.left, y);
                    else ctx.lineTo(borders.left, y);
                }
                ctx.stroke();

                ctx.beginPath();
                for (let y = 0; y <= CANVAS_HEIGHT; y += 10) {
                    let borders = getTrackBorders(y);
                    if (y === 0) ctx.moveTo(borders.right, y);
                    else ctx.lineTo(borders.right, y);
                }
                ctx.stroke();

            } else if (currentType === "CANYON") {
                ctx.fillStyle = '#002266';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = '#8d6e63';
                ctx.beginPath();
                for (let y = 0; y <= CANVAS_HEIGHT; y += 10) {
                    let borders = getTrackBorders(y);
                    if (y === 0) ctx.moveTo(0, y);
                    ctx.lineTo(borders.left, y);
                }
                ctx.lineTo(0, CANVAS_HEIGHT);
                ctx.fill();

                ctx.beginPath();
                for (let y = 0; y <= CANVAS_HEIGHT; y += 10) {
                    let borders = getTrackBorders(y);
                    if (y === 0) ctx.moveTo(CANVAS_WIDTH, y);
                    ctx.lineTo(borders.right, y);
                }
                ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fill();

                ctx.strokeStyle = '#e65100';
                ctx.lineWidth = 5;
                ctx.beginPath();
                for (let y = 0; y <= CANVAS_HEIGHT; y += 10) {
                    let borders = getTrackBorders(y);
                    if (y === 0) ctx.moveTo(borders.left, y);
                    else ctx.lineTo(borders.left, y);
                }
                ctx.stroke();

                ctx.beginPath();
                for (let y = 0; y <= CANVAS_HEIGHT; y += 10) {
                    let borders = getTrackBorders(y);
                    if (y === 0) ctx.moveTo(borders.right, y);
                    else ctx.lineTo(borders.right, y);
                }
                ctx.stroke();

            } else if (currentType === "OCEAN") {
                ctx.fillStyle = '#0033aa';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 12; i++) {
                    let waveY = (environmentScroll * 1.2 + i * 60) % CANVAS_HEIGHT;
                    ctx.beginPath();
                    ctx.arc(100 + (i * 80) % 500, waveY, 20, 0, Math.PI);
                    ctx.stroke();
                }

                islands.forEach(isl => {
                    ctx.fillStyle = '#2e7d32';
                    ctx.beginPath();
                    ctx.ellipse(isl.x + isl.width / 2, isl.y + isl.height / 2, isl.width / 2, isl.height / 2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fbc02d';
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#fbc02d';
                    ctx.stroke();
                });

            } else if (currentType === "STORM") {
                let grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
                grad.addColorStop(0, '#1a1c23');
                grad.addColorStop(1, '#2d3436');
